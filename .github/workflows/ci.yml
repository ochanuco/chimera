name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # postinstall の `wrangler types` が worker-configuration.d.ts を生成する（gitignore 済み）
  ci:
    uses: ochanuco/.github/.github/workflows/pnpm.yml@25fdeac77a1c1c45bf0c68dc1cc3e45588b6611a # dev/reusable-workflows
