name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # postinstall の `wrangler types` が worker-configuration.d.ts を生成する（gitignore 済み）
  ci:
    uses: ochanuco/.github/.github/workflows/pnpm.yml@71e324e93ea560488bcc309e52c5ce48ef8a282c # v1.3.0
