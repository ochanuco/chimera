name: production release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    uses: ochanuco/.github/.github/workflows/release-pr.yml@25fdeac77a1c1c45bf0c68dc1cc3e45588b6611a # dev/reusable-workflows
    with:
      checklist: |
        - [ ] Cloudflare Workers Builds の production branch が `production` になっている
        - [ ] rollback 手順を直近で確認している
        - [ ] スキーマ変更を含むなら migration が `migrations/` に揃っていて preflight の一覧に出ている
      deploy-note: このPRを `production` に merge すると、Cloudflare Workers Builds が production deploy を開始します。
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
