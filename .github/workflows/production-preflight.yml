name: production preflight

# production への昇格 PR に付く required check。中身は scripts/preflight.sh
on:
  pull_request:
    branches: [production]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    uses: ochanuco/.github/.github/workflows/pnpm.yml@25fdeac77a1c1c45bf0c68dc1cc3e45588b6611a # dev/reusable-workflows
    with:
      run: pnpm run preflight
      timeout-minutes: 10
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
