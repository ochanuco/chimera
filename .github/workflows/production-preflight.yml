name: production preflight

# production への昇格 PR に付く required check。deploy の dry-run で wrangler 設定と
# バンドルが通ることを確かめ、未適用 migration を一覧に出す。migration の適用自体は
# Workers Builds の deploy command（`wrangler d1 migrations apply` → `wrangler deploy`）が行う。
on:
  pull_request:
    branches: [production]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preflight:
    name: production deploy preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Migration files are numbered without gaps or duplicates
        run: |
          expected=1
          for f in $(ls migrations/*.sql | sort); do
            n=$(basename "$f" | sed -E 's/^([0-9]{4})_.*/\1/')
            if [ "$n" != "$(printf '%04d' "$expected")" ]; then
              echo "::error::unexpected migration number in $f (expected $(printf '%04d' "$expected"))"
              exit 1
            fi
            expected=$((expected + 1))
          done

      - name: Wrangler production dry run
        run: npx wrangler deploy --dry-run --outdir=.wrangler-dry-run

      # CLOUDFLARE_API_TOKEN があれば本番 D1 の未適用 migration を一覧に出す。無ければ skip
      # （Workers Builds が deploy 前に apply するので、ここでは fail にしない）。
      - name: List unapplied D1 migrations
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations list chimera --remote
